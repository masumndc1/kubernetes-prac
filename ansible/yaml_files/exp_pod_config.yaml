apiVersion: v1
kind: Pod
metadata:
  name: backend
spec:
  containers:
  - name: backend
    image: bmuschko/web-app:1.0.1
    resources: {}
    envFrom:
      - configMapRef:
          name: db-config
    volumeMounts:
      - name: db-config-volume
        mountPath: /etc/config
  volumes:
    - name: db-config-volume
      configMap:
        name: db-json
  dnsPolicy: ClusterFirst
  restartPolicy: Always
status: {}
